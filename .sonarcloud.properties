# SonarQube Cloud automatic analysis (no CI needed). Generated files and binaries are left out.
sonar.sources=.
sonar.exclusions=css/tokens.css,css/colors.css,css/prefixed.css,css/tailwind.css,fonts/**,demo/**,site/.next/**,**/node_modules/**,.build/**,**/*.test.mjs,Tests/**
sonar.tests=.
sonar.test.inclusions=**/*.test.mjs,Tests/**
